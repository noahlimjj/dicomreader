name: iOS → TestFlight

# Builds, signs and uploads the iOS app to App Store Connect / TestFlight from
# a macOS runner, so no Mac is needed. Needs three repository secrets from an
# App Store Connect API key (Users and Access → Integrations → App Store
# Connect API, role "App Manager"):
#   ASC_KEY_ID      the key ID
#   ASC_ISSUER_ID   the issuer ID (shown above the keys list)
#   ASC_KEY_P8      the full text of the downloaded AuthKey_XXXX.p8 file
# Run it from the Actions tab ("Run workflow") or push a tag like ios-v0.1.0.

on:
  workflow_dispatch:
    inputs:
      submit_to_app_store:
        description: 'Submit to App Store for review'
        type: boolean
        default: true
      skip_build:
        description: 'Skip Xcode build (use latest already uploaded build)'
        type: boolean
        default: false
  push:
    tags: ['ios-v*']

jobs:
  testflight:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    env:
      TEAM_ID: 44BP374T6C
    steps:
      - name: Check the API key secrets
        working-directory: .
        env:
          K: ${{ secrets.ASC_KEY_ID }}
          I: ${{ secrets.ASC_ISSUER_ID }}
          P: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$K" ] || [ -z "$I" ] || [ -z "$P" ]; then
            echo "::error::Add the ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 repository secrets first (see the top of this file)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (iOS 26 SDK)
        if: ${{ !inputs.skip_build }}
        working-directory: .
        run: |
          echo "Installed Xcode versions:"
          ls -d /Applications/Xcode*.app || true
          XCODE_26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_26" ]; then
            echo "Selecting $XCODE_26"
            sudo xcode-select -s "$XCODE_26/Contents/Developer"
          else
            echo "::warning::Xcode 26 not found, selecting highest available"
            LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
            sudo xcode-select -s "$LATEST/Contents/Developer"
          fi
          xcodebuild -version
      - uses: actions/setup-node@v4
        if: ${{ !inputs.skip_build }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - if: ${{ !inputs.skip_build }}
        run: npm ci
      - if: ${{ !inputs.skip_build }}
        run: npm run build
      - if: ${{ !inputs.skip_build }}
        run: npx cap sync ios
      - name: Install Apple certificate and provisioning profile
        if: ${{ !inputs.skip_build }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/
      - name: API key and build number
        if: ${{ !inputs.skip_build }}
        env:
          P: ${{ secrets.ASC_KEY_P8 }}
          K: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$P" > "$RUNNER_TEMP/keys/AuthKey_$K.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$K.p8" >> "$GITHUB_ENV"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $((100 + GITHUB_RUN_NUMBER));/" ios/App/App.xcodeproj/project.pbxproj
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.dicomreader.viewer</key>
              <string>DICOM Mobile AppStore</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
      - name: Archive (signed with the API key)
        if: ${{ !inputs.skip_build }}
        working-directory: app/ios/App
        env:
          K: ${{ secrets.ASC_KEY_ID }}
          I: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$K" -authenticationKeyIssuerID "$I" \
            DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Automatic archive | tail -30
      - name: Upload to App Store Connect (TestFlight)
        if: ${{ !inputs.skip_build }}
        working-directory: app/ios/App
        env:
          K: ${{ secrets.ASC_KEY_ID }}
          I: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$K" -authenticationKeyIssuerID "$I" | tail -30
          echo "Uploaded. It shows up in App Store Connect → TestFlight after processing (10–30 min)."
      - name: Configure App Store Metadata, Screenshots, and Submit
        working-directory: ${{ github.workspace }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 -m pip install --break-system-packages requests pyjwt cryptography
          if [ "${{ github.event.inputs.submit_to_app_store }}" = "false" ]; then
            python3 tools/appstore_client.py all
          else
            python3 tools/appstore_client.py submit
          fi

