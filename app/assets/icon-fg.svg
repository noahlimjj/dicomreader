<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
    <defs>
    <!-- Background: Medical deep obsidian with subtle vignette -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="50%" stop-color="#05080f"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>

    <!-- Scanner Core Ambient Glow -->
    <radialGradient id="ambient" cx="470" cy="512" r="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#05080f" stop-opacity="0"/>
    </radialGradient>

    <!-- Primary Tomographic Gantry Gradient (Cyan to Precision Cobalt Blue) -->
    <linearGradient id="gantry-grad" x1="260" y1="200" x2="780" y2="824" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Bone Density Gradient -->
    <linearGradient id="bone-grad" x1="295" y1="250" x2="725" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Translucent Chamber Gradient -->
    <radialGradient id="tissue-grad" cx="470" cy="512" r="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="65%" stop-color="#0e1a2f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#050912" stop-opacity="0.85"/>
    </radialGradient>
  </defs>
    <g transform="translate(512, 512) scale(0.72) translate(-512, -512)">
      
    <!-- Detector Ring Guides (Subtle Precision Scale) -->
    <circle cx="470" cy="512" r="390" fill="none" stroke="#1e293b" stroke-width="2.5" opacity="0.5"/>
    <circle cx="470" cy="512" r="365" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 20" opacity="0.4"/>

    <!-- Iconic 'D' Gantry: Outer Ring -->
    <path d="M 265 202 
             L 470 202 
             A 310 310 0 0 1 470 822 
             L 265 822 Z" 
          fill="url(#tissue-grad)" 
          stroke="url(#gantry-grad)" 
          stroke-width="15" 
          stroke-linejoin="round"
          filter="drop-shadow(0 0 25px rgba(14, 165, 233, 0.45))"/>

    <!-- Concentric Inner Density Ring (Bone Boundary) -->
    <path d="M 298 258 
             L 470 258 
             A 254 254 0 0 1 470 766 
             L 298 766 Z" 
          fill="#070c14" 
          stroke="url(#bone-grad)" 
          stroke-width="8.5" 
          opacity="0.9"
          stroke-linejoin="round"/>

    <!-- Soft-Tissue Diagnostic Window -->
    <path d="M 330 314 
             L 470 314 
             A 198 198 0 0 1 470 710 
             L 330 710 Z" 
          fill="#0a1322" 
          stroke="#38bdf8" 
          stroke-width="3.5" 
          opacity="0.75"
          stroke-linejoin="round"/>

    <!-- Precision Caliper Axis (Sagittal localizer stem) -->
    <line x1="265" y1="145" x2="265" y2="879" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" filter="drop-shadow(0 0 7px rgba(56, 189, 248, 0.7))"/>

    <!-- Calibration millimeter notches -->
    <line x1="240" y1="265" x2="265" y2="265" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="248" y1="345" x2="265" y2="345" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="240" y1="425" x2="265" y2="425" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="248" y1="599" x2="265" y2="599" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="240" y1="679" x2="265" y2="679" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="248" y1="759" x2="265" y2="759" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Diagnostic Isocenter Target Reticle -->
    <line x1="426" y1="512" x2="446" y2="512" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="494" y1="512" x2="514" y2="512" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="470" y1="468" x2="470" y2="488" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="470" y1="536" x2="470" y2="556" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Center Hub -->
    <circle cx="470" cy="512" r="20" fill="#050a14" stroke="#38bdf8" stroke-width="3.5" filter="drop-shadow(0 0 10px rgba(56, 189, 248, 0.85))"/>
    <circle cx="470" cy="512" r="7" fill="#ffffff"/>

    <!-- Clinical Caliper Measurement Tool (Amber Accent) -->
    <circle cx="655" cy="512" r="6.5" fill="#f59e0b" filter="drop-shadow(0 0 6px #f59e0b)"/>
    <line x1="655" y1="512" x2="685" y2="465" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <circle cx="685" cy="465" r="4.5" fill="#f59e0b"/>
  
    </g>
  </svg>